plugins {
    id 'com.android.application'
}

android {
    namespace 'com.privacyclone.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.privacyclone.app'
        minSdk 26
        targetSdk 27
        versionCode 5
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // VirtualApp's NativeEngine.enableIORedirect() opens libva++.so through
    // ApplicationInfo.nativeLibraryDir. Uncompressed APK-native libraries may
    // be loaded directly from the APK without creating that on-disk file.
    // Force extraction so the engine's filesystem-path requirement is satisfied.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(':virtualapp')
}
