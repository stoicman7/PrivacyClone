plugins {
    id 'com.android.application'
}

android {
    namespace 'com.privacyclone.probe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.privacyclone.probe'
        minSdk 26
        targetSdk 27
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
