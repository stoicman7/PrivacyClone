name: Android CI

on:
  push:
    branches: ["main", "virtual-container-migration"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platforms;android-28" "build-tools;28.0.3" "ndk;21.4.7075529"

      - name: Prepare legacy VirtualApp module for current Android Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/VirtualXposed/VirtualApp/lib/build.gradle")
          text = path.read_text()
          if "namespace " not in text:
              text = text.replace("android {", "android {\n    namespace 'com.lody.virtual'\n    ndkVersion '21.4.7075529'", 1)
          elif "ndkVersion " not in text:
              text = text.replace("android {", "android {\n    ndkVersion '21.4.7075529'", 1)
          path.write_text(text)
          PY

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PrivacyClone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
