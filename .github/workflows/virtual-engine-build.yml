name: Build experimental PrivacyClone virtual engine

on:
  push:
    branches:
      - virtualization-engine-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PrivacyClone and virtualization engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and NDK components
        run: |
          yes | sdkmanager "platforms;android-34" "platforms;android-30" "build-tools;34.0.0" "build-tools;33.0.2" "build-tools;30.0.3" "ndk;21.4.7075529"

      - name: Apply PrivacyClone test identity
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle")
          source = gradle_file.read_text()
          replacements = {
              'applicationId "io.va.exposed64"': 'applicationId "com.privacyclone.probe"',
              'versionCode 1': 'versionCode 2',
              'versionName "1.0.0"': 'versionName "1.0.1"',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit("Expected upstream build setting not found: " + old)
              source = source.replace(old, new, 1)
          gradle_file.write_text(source)

          strings_file = Path("app/src/main/res/values/strings.xml")
          strings = strings_file.read_text()
          for resource in ("app_name", "vxp"):
              old = f'<string name="{resource}">VirtualApp</string>'
              new = f'<string name="{resource}">PrivacyClone</string>'
              if old not in strings:
                  raise SystemExit("Expected app label resource not found: " + resource)
              strings = strings.replace(old, new, 1)
          strings_file.write_text(strings)
          PY

      - name: Build debug APKs
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyClone-virtual-engine-1.0.1
          path: engine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
